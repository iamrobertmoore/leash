<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Geist, Inter, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B90FF"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7E828C"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2F2F3"/></marker>
    <style>
      .box{fill:#0B0B0E;stroke:#26262E;stroke-width:1.5}
      .core{fill:#0E0E16;stroke:#8B90FF;stroke-width:1.5}
      .t{fill:#F2F2F3;font-size:19px;font-weight:600}
      .s{fill:#7E828C;font-size:13px;font-family:'Geist Mono',ui-monospace,monospace}
      .k{fill:#8B90FF;font-size:11px;font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.08em}
      .l{fill:#B9BCC4;font-size:12.5px;font-family:'Geist Mono',ui-monospace,monospace}
      .r{fill:#FF4D4D}.ok{fill:#22C55E}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#050506"/>

  <!-- left: owner and agent -->
  <rect class="box" x="40" y="70" width="250" height="118" rx="6"/>
  <text class="k" x="60" y="98">OWNER</text>
  <text class="t" x="60" y="126">Your passkey</text>
  <text class="s" x="60" y="150">Touch ID · Face ID · phone</text>
  <text class="s" x="60" y="170">no seed phrase</text>

  <rect class="box" x="40" y="400" width="250" height="138" rx="6"/>
  <text class="k" x="60" y="428">AGENT</text>
  <text class="t" x="60" y="456">Any agent key</text>
  <text class="s" x="60" y="480">leash-monad-mcp (Claude,</text>
  <text class="s" x="60" y="498">Cursor) · SDK · a script</text>
  <text class="s" x="60" y="518">can only call pay()</text>

  <!-- centre: hub and account -->
  <rect class="box" x="420" y="56" width="360" height="104" rx="6"/>
  <text class="k" x="440" y="84">LEASHHUB · MONAD MAINNET</text>
  <text class="t" x="440" y="112">One account per passkey</text>
  <text class="s" x="440" y="136">check(agent, seller, $) → status</text>

  <rect class="core" x="420" y="236" width="360" height="248" rx="6"/>
  <text class="k" x="440" y="264">LEASHACCOUNT</text>
  <text class="t" x="440" y="294">The leash, enforced</text>
  <text class="l" x="440" y="326">per agent: $ per day · sellers · expiry</text>
  <text class="l" x="440" y="352">owner ops verified by P256 at 0x0100</text>
  <text class="l" x="440" y="378">pay(): check the leash in the same call</text>
  <text class="l" x="456" y="404"><tspan class="ok">✓</tspan> inside → transfer to the seller</text>
  <text class="l" x="456" y="428"><tspan class="r">✕</tspan> outside → the transaction reverts</text>
  <text class="l" x="440" y="460">revoke: one passkey signature</text>

  <!-- right: registry, seller, envio -->
  <rect class="box" x="910" y="56" width="250" height="104" rx="6"/>
  <text class="k" x="930" y="84">ERC-8004</text>
  <text class="t" x="930" y="112">Identity Registry</text>
  <text class="s" x="930" y="136">every agent, owned by</text>
  <text class="s" x="930" y="154">its Leash account</text>

  <rect class="box" x="910" y="250" width="250" height="150" rx="6"/>
  <text class="k" x="930" y="278">SELLER</text>
  <text class="t" x="930" y="306">Paid API, site, contract</text>
  <text class="s" x="930" y="330">leashGate():</text>
  <text class="s" x="930" y="350">402 → paid in leash → 200</text>
  <text class="s" x="930" y="370">403 if over cap / revoked</text>

  <rect class="box" x="910" y="470" width="250" height="118" rx="6"/>
  <text class="k" x="930" y="498">ENVIO HYPERINDEX</text>
  <text class="t" x="930" y="526">Agent track record</text>
  <text class="s" x="930" y="550">payments · sellers · revokes</text>
  <text class="s" x="930" y="570">live network view</text>

  <!-- arrows -->
  <path d="M290 150 C 360 150, 360 290, 418 290" fill="none" stroke="#8B90FF" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="l" x="300" y="122">leash · cap</text>
  <text class="l" x="300" y="140">revoke</text>

  <path d="M290 470 C 360 470, 360 400, 418 400" fill="none" stroke="#F2F2F3" stroke-width="1.6" marker-end="url(#w)"/>
  <text class="l" x="300" y="512">pay(seller, $)</text>

  <path d="M600 160 L600 234" fill="none" stroke="#7E828C" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#g)"/>
  <text class="s" x="610" y="204">reads the leash</text>

  <path d="M780 280 C 840 280, 840 110, 908 110" fill="none" stroke="#7E828C" stroke-width="1.4" marker-end="url(#g)"/>
  <text class="s" x="842" y="98">register</text>

  <path d="M780 404 C 850 404, 850 330, 908 330" fill="none" stroke="#22C55E" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="l" x="796" y="440" fill="#22C55E">$ inside the leash</text>

  <path d="M1035 250 C 1035 210, 820 200, 782 120" fill="none" stroke="#8B90FF" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="s" x="1046" y="238">check() first</text>

  <path d="M780 470 C 840 520, 870 530, 908 530" fill="none" stroke="#7E828C" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#g)"/>
  <text class="s" x="790" y="560">events</text>
  <path d="M1035 470 L1035 402" fill="none" stroke="#7E828C" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#g)"/>
  <text class="s" x="1045" y="444">history</text>

  <text class="s" x="40" y="620">Every refusal is an on-chain revert. The seller's check reads the same leash that pay() enforces.</text>
</svg>
